<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>حلبة القتال</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Tajawal,Arial,sans-serif;height:100%;width:100%;touch-action:none;}
  #c{position:fixed;top:0;left:0;width:100%;height:100%;}
  #loading{position:fixed;inset:0;background:#0E2A47;color:#D4AF37;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;font-size:20px;}
  #hud{position:fixed;top:10px;left:10px;right:10px;z-index:10;display:flex;justify-content:space-between;pointer-events:none;}
  .bar-wrap{width:42%;background:#0006;border:2px solid #D4AF37;border-radius:8px;padding:3px;}
  .bar{height:16px;border-radius:5px;transition:width .2s;}
  #hpP{background:#2ecc71;width:100%;}
  #hpB{background:#e74c3c;width:100%;margin-left:auto;}
  .name{color:#fff;font-size:12px;text-align:center;margin-bottom:2px;}
  #joyZone{position:fixed;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #D4AF37;z-index:20;}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#D4AF37cc;}
  #btns{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .btn{width:70px;height:70px;border-radius:50%;background:#0E2A47cc;border:2px solid #D4AF37;color:#D4AF37;font-size:14px;display:flex;align-items:center;justify-content:center;user-select:none;}
  .btn:active{background:#D4AF37;color:#0E2A47;}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000c;color:#D4AF37;font-size:36px;z-index:60;gap:20px;}
  #msg button{font-size:18px;padding:10px 25px;border-radius:8px;border:2px solid #D4AF37;background:#0E2A47;color:#D4AF37;}
</style>
</head>
<body>
<div id="loading">جاري تحميل النماذج... <span id="pct">0%</span></div>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar-wrap"><div class="name">أنت</div><div id="hpP" class="bar"></div></div>
  <div class="bar-wrap"><div class="name">الخصم</div><div id="hpB" class="bar"></div></div>
</div>
<div id="joyZone"><div id="joyKnob"></div></div>
<div id="btns">
  <div class="btn" id="jumpBtn">قفز</div>
  <div class="btn" id="atkBtn">ضرب</div>
</div>
<div id="msg"><div id="msgText"></div><button onclick="location.reload()">إعادة</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { SkeletonUtils } from 'three/addons/utils/SkeletonUtils.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.Fog(0x1a1410, 15, 40);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

const hemi = new THREE.HemisphereLight(0xfff2cc, 0x201005, 0.9);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffe8c0, 1.3);
dir.position.set(5,10,5);
dir.castShadow = true;
dir.shadow.mapSize.set(1024,1024);
scene.add(dir);

// الحلبة
const arenaRadius = 6;
const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(arenaRadius, arenaRadius, 0.3, 48),
  new THREE.MeshStandardMaterial({color:0x3a2a1a, roughness:0.9})
);
floor.receiveShadow = true;
scene.add(floor);

const ringGeo = new THREE.TorusGeometry(arenaRadius+0.15, 0.12, 12, 48);
const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({color:0xD4AF37, metalness:0.6, roughness:0.3}));
ring.rotation.x = Math.PI/2;
ring.position.y = 0.05;
scene.add(ring);

// أعمدة حول الحلبة
for(let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.6,8), new THREE.MeshStandardMaterial({color:0xD4AF37}));
  pole.position.set(Math.cos(a)*(arenaRadius+0.2), 0.8, Math.sin(a)*(arenaRadius+0.2));
  pole.castShadow = true;
  scene.add(pole);
}

camera.position.set(0, 3.2, 7);

// تحميل النماذج
const loader = new FBXLoader();
const pct = document.getElementById('pct');
let loaded = 0;
function track(xhr){ if(xhr.total){ loaded = Math.max(loaded, xhr.loaded/xhr.total*100); pct.textContent = Math.floor(loaded/2)+'%'; } }

let kickFbx=null, strafeFbx=null;
Promise.all([
  new Promise(res=>loader.load('assets/Sword_And_Shield_Kick.fbx', o=>res(o), track)),
  new Promise(res=>loader.load('assets/Sword_And_Shield_Strafe.fbx', o=>res(o), track))
]).then(([kick, strafe])=>{
  kickFbx = kick; strafeFbx = strafe;
  document.getElementById('loading').style.display='none';
  init();
});

let player, bot, mixerP, mixerB, actionsP={}, actionsB={};
let playerHP=100, botHP=100, gameOver=false;
let playerAirborne=false, playerVY=0;
let joyX=0;
let atkCooldownP=0, atkCooldownB=0;

function buildFighter(){
  const model = SkeletonUtils.clone(kickFbx);
  model.scale.setScalar(0.011);
  model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  const mixer = new THREE.AnimationMixer(model);
  const kickClip = kickFbx.animations[0].clone();
  const walkClip = strafeFbx.animations[0].clone();
  const actions = {
    idle: mixer.clipAction(walkClip),
    walk: mixer.clipAction(walkClip),
    kick: mixer.clipAction(kickClip)
  };
  actions.kick.setLoop(THREE.LoopOnce);
  actions.kick.clampWhenFinished = true;
  actions.idle.play();
  return {model, mixer, actions};
}

function init(){
  const p = buildFighter();
  player = p.model; mixerP = p.mixer; actionsP = p.actions;
  player.position.set(-2,0,0);
  player.rotation.y = Math.PI/2;
  scene.add(player);

  const b = buildFighter();
  bot = b.model; mixerB = b.mixer; actionsB = b.actions;
  bot.position.set(2,0,0);
  bot.rotation.y = -Math.PI/2;
  scene.add(bot);

  animate();
}

// عصا التحكم
const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive=false, joyStartX=0;
function joyDown(e){ joyActive=true; }
function joyMove(e){
  if(!joyActive) return;
  const t = e.touches ? e.touches[0] : e;
  const rect = joyZone.getBoundingClientRect();
  let dx = t.clientX - (rect.left+rect.width/2);
  const max = 45;
  dx = Math.max(-max, Math.min(max, dx));
  joyKnob.style.left = (35+dx)+'px';
  joyX = dx/max;
}
function joyUp(){ joyActive=false; joyX=0; joyKnob.style.left='35px'; }
joyZone.addEventListener('touchstart', joyDown);
joyZone.addEventListener('touchmove', joyMove);
joyZone.addEventListener('touchend', joyUp);
joyZone.addEventListener('mousedown', joyDown);
window.addEventListener('mousemove', joyMove);
window.addEventListener('mouseup', joyUp);

document.getElementById('jumpBtn').addEventListener('touchstart', doJump);
document.getElementById('jumpBtn').addEventListener('mousedown', doJump);
document.getElementById('atkBtn').addEventListener('touchstart', doAttack);
document.getElementById('atkBtn').addEventListener('mousedown', doAttack);

function doJump(e){ e.preventDefault(); if(!playerAirborne && !gameOver){ playerAirborne=true; playerVY=0.13; } }
function doAttack(e){
  e.preventDefault();
  if(gameOver || atkCooldownP>0) return;
  atkCooldownP = 0.9;
  actionsP.kick.reset().play();
  setTimeout(()=>{
    if(gameOver) return;
    const dist = player.position.distanceTo(bot.position);
    if(dist < 1.8){ botHP = Math.max(0, botHP-14); updateHP(); }
  }, 380);
}

function updateHP(){
  document.getElementById('hpP').style.width = playerHP+'%';
  document.getElementById('hpB').style.width = botHP+'%';
  if(!gameOver && (playerHP<=0 || botHP<=0)){
    gameOver = true;
    document.getElementById('msg').style.display='flex';
    document.getElementById('msgText').textContent = botHP<=0 ? '🏆 فزت!' : '☠️ خسرت!';
  }
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(!gameOver){
    // حركة اللاعب يمين/يسار
    if(Math.abs(joyX)>0.08){
      player.position.x += joyX*dt*3;
      player.position.x = Math.max(-arenaRadius+1, Math.min(arenaRadius-1, player.position.x));
      if(actionsP.walk && !actionsP.walk.isRunning() && !actionsP.kick.isRunning()) actionsP.walk.play();
      player.rotation.y = joyX>0 ? Math.PI/2 - 0.3 : Math.PI/2 + 0.3;
    } else if(actionsP.walk){
      actionsP.walk.stop();
      actionsP.idle.play();
      player.rotation.y = player.position.x < bot.position.x ? Math.PI/2 : -Math.PI/2;
    }
    player.position.z = 0;

    // قفزة اللاعب
    if(playerAirborne){
      player.position.y += playerVY;
      playerVY -= 0.012;
      if(player.position.y<=0){ player.position.y=0; playerAirborne=false; }
    }

    // ذكاء البوت: يتبع اللاعب ويهاجم
    const dist = player.position.distanceTo(bot.position);
    bot.rotation.y = player.position.x < bot.position.x ? Math.PI/2 : -Math.PI/2;
    if(dist > 1.7){
      bot.position.x += (player.position.x > bot.position.x ? 1 : -1) * dt * 1.2;
      if(!actionsB.kick.isRunning()) actionsB.walk.play();
    } else {
      actionsB.walk.stop();
      if(atkCooldownB<=0 && !actionsB.kick.isRunning()){
        actionsB.kick.reset().play();
        atkCooldownB = 1.4;
        setTimeout(()=>{
          if(gameOver) return;
          const d2 = player.position.distanceTo(bot.position);
          if(d2 < 1.8 && !playerAirborne){ playerHP = Math.max(0, playerHP-10); updateHP(); }
        }, 380);
      } else if(!actionsB.kick.isRunning()){
        actionsB.idle.play();
      }
    }
    atkCooldownP -= dt; atkCooldownB -= dt;

    if(mixerP) mixerP.update(dt);
    if(mixerB) mixerB.update(dt);
  }

  // كاميرا تتبع اللاعب
  const midX = (player.position.x + bot.position.x)/2;
  camera.position.x += (midX - camera.position.x)*0.08;
  camera.position.y = 3.2;
  camera.position.z = 7 + Math.abs(player.position.x-bot.position.x)*0.15;
  camera.lookAt((player.position.x+bot.position.x)/2, 1, 0);

  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
