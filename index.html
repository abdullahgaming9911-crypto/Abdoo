<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>حلبة القتال</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Tajawal,Arial,sans-serif;height:100%;width:100%;touch-action:none;}
  #c{position:fixed;top:0;left:0;width:100%;height:100%;}
  #loading{position:fixed;inset:0;background:#0E2A47;color:#D4AF37;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;font-size:20px;text-align:center;}
  #hud{position:fixed;top:10px;left:10px;right:10px;z-index:10;display:flex;justify-content:space-between;pointer-events:none;}
  .bar-wrap{width:42%;background:#0006;border:2px solid #D4AF37;border-radius:8px;padding:3px;}
  .bar{height:16px;border-radius:5px;transition:width .2s;}
  #hpP{background:#2ecc71;width:100%;}
  #hpB{background:#e74c3c;width:100%;margin-left:auto;}
  .name{color:#fff;font-size:12px;text-align:center;margin-bottom:2px;}
  #joyZone{position:fixed;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #D4AF37;z-index:20;}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#D4AF37cc;}
  #btns{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .btn{width:70px;height:70px;border-radius:50%;background:#0E2A47cc;border:2px solid #D4AF37;color:#D4AF37;font-size:14px;display:flex;align-items:center;justify-content:center;user-select:none;}
  .btn:active{background:#D4AF37;color:#0E2A47;}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000c;color:#D4AF37;font-size:36px;z-index:60;gap:20px;}
  #msg button{font-size:18px;padding:10px 25px;border-radius:8px;border:2px solid #D4AF37;background:#0E2A47;color:#D4AF37;}
</style>
</head>
<body>
<div id="loading">جاري تحميل النموذج... <span id="pct">0%</span></div>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar-wrap"><div class="name">أنت</div><div id="hpP" class="bar"></div></div>
  <div class="bar-wrap"><div class="name">الخصم</div><div id="hpB" class="bar"></div></div>
</div>
<div id="joyZone"><div id="joyKnob"></div></div>
<div id="btns">
  <div class="btn" id="jumpBtn">قفز</div>
  <div class="btn" id="atkBtn">ضرب</div>
</div>
<div id="msg"><div id="msgText"></div><button onclick="location.reload()">إعادة</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { SkeletonUtils } from 'three/addons/utils/SkeletonUtils.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.Fog(0x1a1410, 15, 40);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

const hemi = new THREE.HemisphereLight(0xfff2cc, 0x201005, 0.9);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffe8c0, 1.3);
dir.position.set(5,10,5);
dir.castShadow = true;
dir.shadow.mapSize.set(1024,1024);
scene.add(dir);

// الحلبة
const arenaRadius = 6;
const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(arenaRadius, arenaRadius, 0.3, 48),
  new THREE.MeshStandardMaterial({color:0x3a2a1a, roughness:0.9})
);
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(new THREE.TorusGeometry(arenaRadius+0.15, 0.12, 12, 48), new THREE.MeshStandardMaterial({color:0xD4AF37, metalness:0.6, roughness:0.3}));
ring.rotation.x = Math.PI/2;
ring.position.y = 0.05;
scene.add(ring);

for(let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.6,8), new THREE.MeshStandardMaterial({color:0xD4AF37}));
  pole.position.set(Math.cos(a)*(arenaRadius+0.2), 0.8, Math.sin(a)*(arenaRadius+0.2));
  pole.castShadow = true;
  scene.add(pole);
}

camera.position.set(0, 3.2, 7);

// ============ تحميل نموذج اللاعب (ملف واحد فقط) ============
const loader = new FBXLoader();
const pct = document.getElementById('pct');

function showError(msg){
  document.getElementById('loading').innerHTML =
    '<div style="color:#e74c3c;padding:20px;max-width:90%">'+msg+'</div>';
}

let baseFbx = null;

loader.load(
  'assets/Sword_And_Shield_Strafe.fbx',
  (obj)=>{
    baseFbx = obj;
    document.getElementById('loading').style.display='none';
    init();
  },
  (xhr)=>{
    if(xhr.lengthComputable && xhr.total){
      pct.textContent = Math.floor(xhr.loaded/xhr.total*100)+'%';
    }
  },
  (err)=>{
    console.error(err);
    showError('فشل تحميل النموذج ⚠️<br>تأكد ان مجلد assets موجود بنفس مكان index.html، وبداخله ملف:<br>Sword_And_Shield_Strafe.fbx');
  }
);

setTimeout(()=>{
  if(!baseFbx && document.getElementById('loading').style.display !== 'none'){
    showError('التحميل طويل جداً ⏳<br>تأكد من سرعة النت.');
  }
}, 60000);

// ============ بناء اللاعب من النموذج المحمّل ============
function findBone(root, keyword){
  let found=null;
  root.traverse(o=>{ if(!found && o.isBone && o.name.toLowerCase().includes(keyword)) found=o; });
  return found;
}

function buildPlayer(){
  const model = SkeletonUtils.clone(baseFbx);
  model.scale.setScalar(0.011);
  model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  const mixer = new THREE.AnimationMixer(model);
  const walkClip = baseFbx.animations[0].clone();
  const actions = { idle: mixer.clipAction(walkClip), walk: mixer.clipAction(walkClip) };
  actions.idle.play();
  const armBone = findBone(model, 'righthand') || findBone(model, 'rightforearm') || findBone(model, 'rightarm');
  return {model, mixer, actions, armBone};
}

// ============ بناء البوت (تصميم بسيط بأشكال هندسية - بدون ملف خارجي) ============
function buildBot(){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color:0x7a3b2e, roughness:0.7});
  const cloth = new THREE.MeshStandardMaterial({color:0x2c2c2c, roughness:0.8});
  const metal = new THREE.MeshStandardMaterial({color:0x888888, metalness:0.7, roughness:0.3});

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.5,4,8), cloth);
  torso.position.y = 1.05;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2,16,16), skin);
  head.position.y = 1.55;
  head.castShadow = true;
  g.add(head);

  const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.22,0.18,12), metal);
  helmet.position.y = 1.68;
  g.add(helmet);

  const legGeo = new THREE.CapsuleGeometry(0.09,0.5,4,8);
  const legL = new THREE.Mesh(legGeo, cloth); legL.position.set(-0.13,0.45,0); legL.castShadow=true; g.add(legL);
  const legR = new THREE.Mesh(legGeo, cloth); legR.position.set(0.13,0.45,0); legR.castShadow=true; g.add(legR);

  const armGeo = new THREE.CapsuleGeometry(0.08,0.4,4,8);
  const armL = new THREE.Mesh(armGeo, skin); armL.position.set(-0.35,1.1,0); armL.castShadow=true; g.add(armL);
  const shield = new THREE.Mesh(new THREE.CircleGeometry(0.22,16), metal);
  shield.position.set(-0.5,1.1,0.05);
  g.add(shield);

  const armPivot = new THREE.Group();
  armPivot.position.set(0.35,1.35,0);
  const armR = new THREE.Mesh(armGeo, skin);
  armR.position.set(0,-0.2,0);
  armR.castShadow = true;
  armPivot.add(armR);
  const fist = new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10), skin);
  fist.position.set(0,-0.42,0);
  armPivot.add(fist);
  g.add(armPivot);

  g.legL = legL; g.legR = legR; g.armPivot = armPivot;
  return g;
}

let player, bot;
let mixerP, actionsP={}, playerArmBone=null;
let playerHP=100, botHP=100, gameOver=false;
let playerAirborne=false, playerVY=0;
let joyX=0;
let atkCooldownP=0, atkCooldownB=0;
let swingTimerP=0, swingTimerB=0;
let walkTime=0;

function init(){
  const p = buildPlayer();
  player = p.model; mixerP = p.mixer; actionsP = p.actions; playerArmBone = p.armBone;
  player.position.set(-2,0,0);
  player.rotation.y = Math.PI/2;
  scene.add(player);

  bot = buildBot();
  bot.position.set(2,0,0);
  bot.rotation.y = -Math.PI/2;
  scene.add(bot);

  animate();
}

const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive=false;
function joyDown(){ joyActive=true; }
function joyMove(e){
  if(!joyActive) return;
  const t = e.touches ? e.touches[0] : e;
  const rect = joyZone.getBoundingClientRect();
  let dx = t.clientX - (rect.left+rect.width/2);
  const max = 45;
  dx = Math.max(-max, Math.min(max, dx));
  joyKnob.style.left = (35+dx)+'px';
  joyX = dx/max;
}
function joyUp(){ joyActive=false; joyX=0; joyKnob.style.left='35px'; }
joyZone.addEventListener('touchstart', joyDown);
joyZone.addEventListener('touchmove', joyMove);
joyZone.addEventListener('touchend', joyUp);
joyZone.addEventListener('mousedown', joyDown);
window.addEventListener('mousemove', joyMove);
window.addEventListener('mouseup', joyUp);

document.getElementById('jumpBtn').addEventListener('touchstart', doJump);
document.getElementById('jumpBtn').addEventListener('mousedown', doJump);
document.getElementById('atkBtn').addEventListener('touchstart', doAttack);
document.getElementById('atkBtn').addEventListener('mousedown', doAttack);

function doJump(e){ e.preventDefault(); if(!playerAirborne && !gameOver){ playerAirborne=true; playerVY=0.13; } }
function doAttack(e){
  e.preventDefault();
  if(gameOver || atkCooldownP>0 || !player) return;
  atkCooldownP = 0.7;
  swingTimerP = 0.32;
  setTimeout(()=>{
    if(gameOver) return;
    const dist = player.position.distanceTo(bot.position);
    if(dist < 1.9){ botHP = Math.max(0, botHP-14); updateHP(); }
  }, 180);
}

function updateHP(){
  document.getElementById('hpP').style.width = playerHP+'%';
  document.getElementById('hpB').style.width = botHP+'%';
  if(!gameOver && (playerHP<=0 || botHP<=0)){
    gameOver = true;
    document.getElementById('msg').style.display='flex';
    document.getElementById('msgText').textContent = botHP<=0 ? '🏆 فزت!' : '☠️ خسرت!';
  }
}

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(!gameOver){
    if(Math.abs(joyX)>0.08){
      player.position.x += joyX*dt*3;
      player.position.x = Math.max(-arenaRadius+1, Math.min(arenaRadius-1, player.position.x));
      if(actionsP.walk && !actionsP.walk.isRunning()) actionsP.walk.play();
      player.rotation.y = joyX>0 ? Math.PI/2 - 0.3 : Math.PI/2 + 0.3;
    } else {
      player.rotation.y = player.position.x < bot.position.x ? Math.PI/2 : -Math.PI/2;
    }
    player.position.z = 0;

    if(playerAirborne){
      player.position.y += playerVY;
      playerVY -= 0.012;
      if(player.position.y<=0){ player.position.y=0; playerAirborne=false; }
    }

    if(swingTimerP>0){
      swingTimerP -= dt;
      if(playerArmBone) playerArmBone.rotation.x = -1.8 * Math.sin((0.32-swingTimerP)/0.32*Math.PI);
      player.position.x += (player.position.x < bot.position.x ? 1 : -1) * dt * 0.4;
    } else if(playerArmBone){
      playerArmBone.rotation.x = 0;
    }

    const dist = player.position.distanceTo(bot.position);
    bot.rotation.y = player.position.x < bot.position.x ? Math.PI/2 : -Math.PI/2;
    let botWalking = false;
    if(dist > 1.7 && swingTimerB<=0){
      bot.position.x += (player.position.x > bot.position.x ? 1 : -1) * dt * 1.2;
      botWalking = true;
    } else if(atkCooldownB<=0 && swingTimerB<=0){
      swingTimerB = 0.32;
      atkCooldownB = 1.3;
      setTimeout(()=>{
        if(gameOver) return;
        const d2 = player.position.distanceTo(bot.position);
        if(d2 < 1.9 && !playerAirborne){ playerHP = Math.max(0, playerHP-10); updateHP(); }
      }, 180);
    }

    walkTime += dt * (botWalking?8:0);
    bot.legL.rotation.x = Math.sin(walkTime)*0.5;
    bot.legR.rotation.x = -Math.sin(walkTime)*0.5;

    if(swingTimerB>0){
      swingTimerB -= dt;
      bot.armPivot.rotation.x = -2.2 * Math.sin((0.32-swingTimerB)/0.32*Math.PI);
    } else {
      bot.armPivot.rotation.x = 0;
    }

    atkCooldownP -= dt; atkCooldownB -= dt;
    if(mixerP) mixerP.update(dt);
  }

  const midX = (player.position.x + bot.position.x)/2;
  camera.position.x += (midX - camera.position.x)*0.08;
  camera.position.y = 3.2;
  camera.position.z = 7 + Math.abs(player.position.x-bot.position.x)*0.15;
  camera.lookAt((player.position.x+bot.position.x)/2, 1, 0);

  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
